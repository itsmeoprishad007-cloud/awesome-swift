name: PR Check

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: latest
    steps:
      - uses: actions/checkout
      - uses: ruby/setup-ruby
        with:
          ruby-version: 2.7
          bundler-cache: false
      - run: gem install awesome_bot
      - run: awesome_bot --allow=429 contents.json -w AERecord,theswiftwebdeveloper,bluemix,swiftplayground,awesome-for-swift-cheatsheet
      - run: pip install json-spec
      - run: json delete --schema-file=.github/schema.json --document-file=contents.json
